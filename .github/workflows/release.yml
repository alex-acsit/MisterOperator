# Publishes a release whenever arcadekiosk.py's VERSION changes on main (or a
# vX.Y tag is pushed): runs the tests, builds the SD-card zip and creates the
# release (and its tag). The kiosk's updater installs the latest release.
name: Release

on:
  push:
    branches: [main]
    paths: ["arcade_kiosk/arcadekiosk.py"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' arcade_kiosk/arcadekiosk.py)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$v" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match VERSION $v in arcadekiosk.py"
            exit 1
          fi
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "Release v$v already exists; nothing to do."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Run tests
        if: env.SKIP != '1'
        run: bash tests/run_tests.sh

      - name: Build the SD-card zip
        if: env.SKIP != '1'
        run: |
          rm -rf arcade_kiosk/__pycache__
          mkdir -p arcade_kiosk/art
          zip -qr "MisterOperator_v${VERSION}.zip" arcade_kiosk Scripts -x '*/__pycache__/*'
          unzip -l "MisterOperator_v${VERSION}.zip" | tail -1

      - name: Publish
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(git log -1 --format=%B)
          gh release create "v${VERSION}" "MisterOperator_v${VERSION}.zip" \
            --target "$GITHUB_SHA" --title "MisterOperator ${VERSION}" --notes "$notes"
