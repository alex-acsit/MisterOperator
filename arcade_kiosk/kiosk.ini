[kiosk]
; ---------------------------------------------------------------------------
; Arcade Kiosk settings. Lines starting with ; are comments.
; After editing, reboot the MiSTer (or run: arcadekiosk.py --rescan).
; ---------------------------------------------------------------------------

; Where the .mra files live, and whether to look in sub-folders too.
arcade_dir = /media/fat/_Arcade
include_subdirs = 0
; 1 = also list .mgl (MiSTer Game Launcher) files found in that folder.
; A plain .mgl shows its file name and is grouped under its core's name as
; the genre. To give it full details, add any of these tags inside
; <mistergamedescription>: <name> <year> <manufacturer> <category> <rotation>
; (the MiSTer ignores them, so the file still works everywhere else).
include_mgl = 1
exclude_dirs = _alternatives,cores,_Organized

; Optional: a text file listing the only games to show, one .mra file name
; per line (e.g. "Galaga (Namco rev. B).mra"). Leave empty to show all.
game_list =

; Lock the cabinet to one game: the .mra (or .mgl) to start at power-on and
; whenever the cabinet is locked. MENU does nothing, games never quit for
; being idle, and if the game drops out it starts again. Hold OPERATOR for
; the operator menu as usual. Blank = the game list. Set it in the operator
; menu under SINGLE GAME.
single_game =

; Which games to show, going by the <rotation> in each .mra file:
;   all        = every game (default)
;   horizontal = only horizontal (YOKO) games, for a normal landscape monitor
;   vertical   = only vertical (TATE) games, for a monitor turned on its side
; Attract mode follows this too.
orientation = all

; Lock the list to certain genres, from the <category> in each .mra file.
; Comma-separated, not case-sensitive, e.g.  genres = Shooter, Maze
; A game matches if any part of its category matches, so "Vertical" also
; picks up "Shooter / Vertical". "Other" means games with no category.
; Leave empty for every genre. To see the names your games use, run:
;   python3 /media/fat/arcade_kiosk/arcadekiosk.py --genres
; With one genre the list shows its name and button 2 does nothing.
; Attract mode follows this too.
genres =
; Genres to hide, same format, e.g.  exclude_genres = Mahjong, Quiz
exclude_genres =
; Genres switched off in the operator menu (GENRES). Matches each game's main
; genre exactly. Easiest to change from the operator menu.
hidden_genres =

; 1 = show "Pac-Man" instead of "Pac-Man (Midway)" unless two sets clash.
short_names = 1

; Colours. theme = green (default: dark grey, green and white),
; phosphor (all-green terminal look) or classic (pink / amber on navy).
; Any single colour can be changed with color_<name> = #RRGGBB, e.g.
;   color_accent = #289655     selection bar, top rule and borders
;   color_bg     = #1A1C1B     background       color_panel  = box behind art
;   color_title  = #F5F7F6     title and year   color_info   = genre text
;   color_text   = #DEE2E0     game names       color_dim    = counts and hints
;   color_select = #FFFFFF     name on the selection bar
;   color_line   = dividers    color_white  = message text
theme = green

; Which way the monitor is mounted:
;   yoko     = normal landscape monitor (default)
;   tate_cw  = monitor turned on its side (vertical / TATE)
;   tate_ccw = the same, turned the other way
; In TATE the list is drawn upright with a portrait layout. If it comes out
; upside down, switch between tate_cw and tate_ccw. Pair it with
; orientation = vertical to list only vertical games.
screen = yoko

; Screen text. The version number shows at the bottom right.
title = ARCADE
footer_play = PRESS 1 TO PLAY

; Box art folder (100x75 .rgb files made with tools/make_art.py).
art_dir = /media/fat/arcade_kiosk/art

; ---------------------------------------------------------------------------
; Buttons
; Leave menu_button / operator_button empty and the kiosk asks you to press
; them on screen the first time it starts. Names like BTN_BASE4 or numbers
; like 0x129 both work. *_device limits a button to one controller
; (vid:pid or part of its name); empty = any controller.
; ---------------------------------------------------------------------------
menu_button =
menu_device =
operator_button =
operator_device =

; How long the operator button must be held to lock/unlock (milliseconds).
operator_hold_ms = 1500

; 1 = holding OPERATOR opens the operator menu, drawn in the kiosk's theme:
;     volume, credits, demo and idle timings, NVRAM, screen, theme, play
;     counts, game settings (DIP switches), the log, the stock MiSTer menu
;     and reboot. Changes are saved to this file.
; 0 = holding OPERATOR goes straight to the stock MiSTer menu (old behaviour).
operator_menu = 1
; Lock again by itself after this many seconds with no input (0 = never).
operator_timeout_s = 300

; 0 = a single press of the menu button quits the game.
; Set e.g. 800 to require a hold instead.
menu_hold_ms = 0

; Ignore the menu button for this many seconds after a game starts,
; so a stray press does not quit straight away.
exit_grace_s = 3

; 1 = always start locked after power-on (recommended for a cabinet).
lock_on_boot = 1

; Buttons used on the game list (directions are always stick / d-pad / arrows).
launch_buttons = BTN_TRIGGER,BTN_SOUTH,BTN_START,KEY_ENTER,KEY_LEFTCTRL,KEY_1
; Next genre / previous genre / jump to a letter. The letter button opens
; an A-Z picker: move the stick to choose (the list follows), then press
; any button, or leave it for 6 s. Left/right on the list still jumps one
; letter at a time.
genre_buttons = BTN_THUMB,BTN_EAST,KEY_LEFTALT,KEY_2
genre_back_buttons = BTN_THUMB2,BTN_NORTH,KEY_SPACE,KEY_3
letter_buttons = BTN_TOP,BTN_WEST,KEY_LEFTSHIFT,KEY_4
; Keys that move the list like the stick, for encoders whose stick sends
; other keys, e.g. KEY_R:up,KEY_F:down,KEY_D:left,KEY_G:right. CONTROLLER
; SETUP in the operator menu fills this in (and the four lines above).
dir_keys =

; Coins put in on the game list (or during a demo) are held and shown as
; CREDITS on screen, then inserted into the game the player picks once it
; has had coin_delay_s seconds to load. Coins put in during a game go
; straight to the game as normal. Credits survive a reboot. Demos don't
; start while credits are waiting.
; coin_buttons are the codes your coin mech / coin button sends: with
; log_inputs = 1, drop a coin and look for "key ... down" in the log.
coin_buttons = KEY_5,KEY_6,BTN_SELECT,BTN_BASE3
coin_delay_s = 30
; Most credits that can be held at once.
max_credits = 9

; Input devices the kiosk should leave alone (vid:pid or part of the name).
ignore_devices =

; Return to the game you last played when the list comes back.
remember_last = 1

; Quit a game back to the list when nobody has touched the controls for this
; many seconds (300 = 5 minutes). Stick wobble around centre doesn't count.
; 0 = never. Only applies while locked.
game_idle_exit_s = 300

; Save the NVRAM (settings, high scores, CMOS) of games whose .mra has
; <nvram>, such as NBA Jam. The MiSTer only saves NVRAM when its own menu
; opens, so the kiosk flashes it open for a fraction of a second on quitting.
;   once   = only until the game has a good save (default). Stops the CMOS
;            error; the flash then stops too, but new high scores aren't kept.
;   always = every time (keeps high scores; brief flash on every quit).
;   off    = never (those games show a CMOS error on every start).
save_nvram = once
; Seconds the MiSTer menu stays open while it saves.
nvram_save_s = 0.3

; ---------------------------------------------------------------------------
; Attract mode
; After the game list has been left alone, demo games play one after another.
; Any button or stick movement goes straight back to the game list.
; ---------------------------------------------------------------------------
; Seconds of no input on the game list before the demo starts (0 = off).
attract_idle_s = 120
; Seconds each demo game runs before moving on to the next one.
attract_game_s = 60
; Optional: a text file of .mra names to use as demos (one per line).
; Empty = any game on the list.
attract_list =
; 1 = include vertical (TATE) games in the demo when orientation = all.
; (Ignored if orientation is horizontal/vertical or attract_list is set.)
attract_vertical = 0
; 1 = mute the sound while demos play.
attract_mute = 0

; ---------------------------------------------------------------------------
; Advanced
; ---------------------------------------------------------------------------
; Extra seconds to wait before taking over the screen from the stock menu.
; Leave at 0 so it shows as briefly as possible; raise only if the game list
; sometimes fails to appear.
menu_settle_s = 0
; Give up on a game that has not started after this many seconds.
launch_timeout_s = 12
; Launcher resolution (320x240 suits a 15 kHz CRT).
fb_width = 320
fb_height = 240
; 1 = write every button press to /tmp/arcadekiosk.log (for finding codes).
log_inputs = 0

; ---------------------------------------------------------------------------
; Standard button layout. Before each game starts, the kiosk writes that game's
; MiSTer button mapping so every game uses the same panel buttons:
;     4 5 6
;     1 2 3
; Games with 6 buttons use 1-6 in order. 1-3 button games use 1, 2, 3.
; 4-button games put game button 1 on panel 4, then 2-4 on panel 1-3.
; Start and Coin are kept; Pause, Service, Test and the like are left
; unmapped. Check what each game gets with:
;   python3 /media/fat/arcade_kiosk/arcadekiosk.py --layout
; Any earlier mapping is backed up to map_backup/ first. To undo:
;   python3 /media/fat/arcade_kiosk/arcadekiosk.py --restore-maps
; and set standard_layout = 0.
; ---------------------------------------------------------------------------
standard_layout = 1
; Which buttons of your controller's MiSTer menu mapping are panel 1-6, Start
; and Coin (A B X Y L R Select Start, as mapped in the MiSTer menu).
; Key names such as BTN_TRIGGER also work.
panel_layout = B,A,R,Y,X,L
panel_start = Start
panel_coin = Select
; Game buttons whose name contains any of these words are left unmapped.
drop_buttons = pause,service,test,tilt,core credits,reset,freeze,slam
; Panel buttons for a game with that many buttons, in the game's button order.
layout_1 = 1
layout_2 = 1,2
layout_3 = 1,2,3
layout_4 = 4,1,2,3
layout_5 = 1,2,3,4,5
layout_6 = 1,2,3,4,5,6

; ---------------------------------------------------------------------------
; Updates
; Update from the operator menu (UPDATE KIOSK), the MiSTer Scripts menu
; (update_arcade_kiosk), or over SSH: arcadekiosk.py --update
; Your settings, credits, play counts and box art are kept, and the previous
; version is saved in backup/ (arcadekiosk.py --rollback to go back).
; ---------------------------------------------------------------------------
; GitHub repo the releases come from.
update_repo = alex-acsit/MisterOperator
; Only needed while the repo is private: a GitHub token with read access.
update_token =
; 1 = check for a new release after boot and once a day, install it in the
;     background, and switch to it the next time nobody's playing.
auto_update = 0
