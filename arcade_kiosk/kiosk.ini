[kiosk]
; ---------------------------------------------------------------------------
; Arcade Kiosk settings. Lines starting with ; are comments.
; After editing, reboot the MiSTer (or run: arcadekiosk.py --rescan).
; ---------------------------------------------------------------------------

; Where the .mra files live, and whether to look in sub-folders too.
arcade_dir = /media/fat/_Arcade
include_subdirs = 0
; 1 = also list .mgl (MiSTer Game Launcher) files found in that folder.
; A plain .mgl shows its file name and is grouped under its core's name as
; the genre. To give it full details, add any of these tags inside
; <mistergamedescription>: <name> <year> <manufacturer> <category> <rotation>
; (the MiSTer ignores them, so the file still works everywhere else).
include_mgl = 1
exclude_dirs = _alternatives,cores,_Organized

; Optional: a text file listing the only games to show, one .mra file name
; per line (e.g. "Galaga (Namco rev. B).mra"). Leave empty to show all.
game_list =

; Which games to show, going by the <rotation> in each .mra file:
;   all        = every game (default)
;   horizontal = only horizontal (YOKO) games, for a normal landscape monitor
;   vertical   = only vertical (TATE) games, for a monitor turned on its side
; Attract mode follows this too.
orientation = all

; Lock the list to certain genres, from the <category> in each .mra file.
; Comma-separated, not case-sensitive, e.g.  genres = Shooter, Maze
; A game matches if any part of its category matches, so "Vertical" also
; picks up "Shooter / Vertical". "Other" means games with no category.
; Leave empty for every genre. To see the names your games use, run:
;   python3 /media/fat/arcade_kiosk/arcadekiosk.py --genres
; With one genre the list shows its name and button 2 does nothing.
; Attract mode follows this too.
genres =
; Genres to hide, same format, e.g.  exclude_genres = Mahjong, Quiz
exclude_genres =

; 1 = show "Pac-Man" instead of "Pac-Man (Midway)" unless two sets clash.
short_names = 1

; Screen text.
title = ARCADE
footer_play = PRESS 1 TO PLAY
footer_genre = 2:GENRE

; Box art folder (100x75 .rgb files made with tools/make_art.py).
art_dir = /media/fat/arcade_kiosk/art

; ---------------------------------------------------------------------------
; Buttons
; Leave menu_button / operator_button empty and the kiosk asks you to press
; them on screen the first time it starts. Names like BTN_BASE4 or numbers
; like 0x129 both work. *_device limits a button to one controller
; (vid:pid or part of its name); empty = any controller.
; ---------------------------------------------------------------------------
menu_button =
menu_device =
operator_button =
operator_device =

; How long the operator button must be held to lock/unlock (milliseconds).
operator_hold_ms = 1500

; 0 = a single press of the menu button quits the game.
; Set e.g. 800 to require a hold instead.
menu_hold_ms = 0

; Ignore the menu button for this many seconds after a game starts,
; so a stray press does not quit straight away.
exit_grace_s = 3

; 1 = always start locked after power-on (recommended for a cabinet).
lock_on_boot = 1

; Buttons used on the game list (directions are always stick / d-pad / arrows).
launch_buttons = BTN_TRIGGER,BTN_SOUTH,BTN_START,KEY_ENTER,KEY_LEFTCTRL,KEY_1
genre_buttons = BTN_THUMB,BTN_EAST,KEY_LEFTALT,KEY_SPACE,KEY_2

; Input devices the kiosk should leave alone (vid:pid or part of the name).
ignore_devices =

; Return to the game you last played when the list comes back.
remember_last = 1

; ---------------------------------------------------------------------------
; Attract mode
; After the game list has been left alone, demo games play one after another.
; Any button or stick movement goes straight back to the game list.
; ---------------------------------------------------------------------------
; Seconds of no input on the game list before the demo starts (0 = off).
attract_idle_s = 90
; Seconds each demo game runs before moving on to the next one.
attract_game_s = 60
; Optional: a text file of .mra names to use as demos (one per line).
; Empty = any game on the list.
attract_list =
; 1 = include vertical (TATE) games in the demo when orientation = all.
; (Ignored if orientation is horizontal/vertical or attract_list is set.)
attract_vertical = 0
; 1 = mute the sound while demos play.
attract_mute = 0

; ---------------------------------------------------------------------------
; Advanced
; ---------------------------------------------------------------------------
; Extra seconds to wait before taking over the screen from the stock menu.
; Leave at 0 so it shows as briefly as possible; raise only if the game list
; sometimes fails to appear.
menu_settle_s = 0
; Give up on a game that has not started after this many seconds.
launch_timeout_s = 12
; Launcher resolution (320x240 suits a 15 kHz CRT).
fb_width = 320
fb_height = 240
; 1 = write every button press to /tmp/arcadekiosk.log (for finding codes).
log_inputs = 0
